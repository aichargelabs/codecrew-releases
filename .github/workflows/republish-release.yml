name: republish-release

# Recreates a release under the github-actions bot identity so no personal
# account appears as the release publisher. Run after any manual mirror.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to republish (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - name: Capture release metadata and assets
        run: |
          gh release view "$TAG" -R "$REPO" --json name,body,isPrerelease > meta.json
          jq -r .body meta.json > notes.md
          mkdir assets && cd assets
          gh release download "$TAG" -R "$REPO" --pattern "*"
          ls -la
      - name: Delete and recreate under bot identity
        run: |
          PRE=$(jq -r .isPrerelease meta.json)
          TITLE=$(jq -r .name meta.json)
          gh release delete "$TAG" -R "$REPO" --yes
          ARGS=""
          if [ "$PRE" = "true" ]; then ARGS="--prerelease"; fi
          gh release create "$TAG" -R "$REPO" --title "$TITLE" --notes-file notes.md --latest $ARGS assets/*
      - name: Verify publisher
        run: |
          gh api "repos/$REPO/releases" --jq '.[0] | {tag: .tag_name, publisher: .author.login}'
